// Сборка порта по образцу официального MDK Forge 1.20.1-47.4.23.
// Отличия от MDK: Kotlin и Kotlin for Forge (SPEC, Р-1), Mixin (Р-6),
// зависимости Botania / Patchouli / Curios, LICENSE.txt и credits в jar.
// Сборка автора для 1.7.10 — legacy/build.gradle, она не компилируется.

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
kotlin.jvmToolchain(17)

// GameTest-ы порта — отдельный набор исходников src/gametest: в CI и в запусках из Gradle
// они загружаются вместе с модом, в jar для игроков не попадают.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
    gametestRuntimeOnly.extendsFrom runtimeOnly
}
// build проверяет, что тесты компилируются; запускает их runGameTestServer
tasks.named('check') { dependsOn 'gametestClasses' }

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // Сеттеры блоков 1.7.10 после создания блока (alfheim.port.legacy.LegacyBlock)
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    copyIdeResources = true

    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // Память под облачную машину на 16 ГБ (см. gradle.properties)
            jvmArgs '-Xmx3G'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.gametest
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // Поднимает GameTestServer, прогоняет все GameTest-ы мода и выходит.
        // Код выхода 0 — все тесты прошли. Запускается в CI.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            // Генерация данных (SPEC, Р-9): результат коммитится в src/generated/resources.
            // Текстуры Botania — для моделей блоков автора, сделанных из блоков Botania (заборы, стены)
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/'), '--existing-mod', 'botania'
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Миксины порта — в alfheim.port.mixin (CLAUDE.md, правило 7).
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

// Карту ссылок миксинов строит процессор аннотаций, пока javac компилирует миксины. MixinGradle перед компиляцией
// удаляет старую карту, а инкрементальная компиляция после правки кода Kotlin не пересобирает ни одного Java-файла —
// и в jar карты нет, игра падает при запуске (tools/check_mixins.py). Java-файлов в порту мало: собираются все.
tasks.named('compileJava', JavaCompile).configure {
    options.incremental = false
}

repositories {
    // ForgeGradle automatically adds the Forge maven and Maven Central for you
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup 'thedarkcolour' }
    }
    maven {
        // Botania, Patchouli
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'vazkii.botania'
            includeGroup 'vazkii.patchouli'
        }
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Kotlin for Forge: язык мода и стандартная библиотека Kotlin в игре (SPEC, Р-1)
    implementation "thedarkcolour:kotlinforforge:${kff_version}"

    // Botania целиком: код автора опирается не только на её API (SPEC, Р-7)
    implementation fg.deobf("vazkii.botania:Botania:${botania_version}")
    // Patchouli и Curios — так, как советуют их авторы: API для компиляции, мод целиком для запуска
    compileOnly fg.deobf("vazkii.patchouli:Patchouli:${patchouli_version}:api")
    runtimeOnly fg.deobf("vazkii.patchouli:Patchouli:${patchouli_version}")
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            kff_version_range: kff_version_range, botania_version_range: botania_version_range,
            patchouli_version_range: patchouli_version_range, curios_version_range: curios_version_range,
            // credits.txt автора целиком — в поле credits файла mods.toml
            credits_txt: file('src/main/resources/credits.txt').getText('UTF-8').trim(),
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    // Лицензия автора едет внутри мода (условие разрешения автора, SPEC, п. 1)
    from('LICENSE.txt')

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
